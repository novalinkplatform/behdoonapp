server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # معادل قانون _redirects کلادفلر پیجز: هر اسلاگ مجله به قالب مقاله می‌رود.
  location ~ ^/magazine/[^/]+$ {
    try_files /article-template.html =404;
  }

  # معادل قانون _redirects کلادفلر پیجز: هر اسلاگ برگه دلخواه به قالب برگه می‌رود.
  location ~ ^/(?:page|p)/[^/]+$ {
    try_files /page-template.html =404;
  }

  # معادل رفتار «آدرس تمیز» کلادفلر پیجز: /about باید about.html را نشان دهد.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
