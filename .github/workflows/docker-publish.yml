name: Publish self-host image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "*.html"
      - "nginx.selfhost.conf"
      - "Dockerfile.selfhost"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.selfhost
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/behbar-site:latest
            ghcr.io/${{ github.repository_owner }}/behbar-site:${{ github.sha }}
