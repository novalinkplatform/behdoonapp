<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه پیدا نشد | بهبار</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: 'Yekan Bakh';
        src: url('/fonts/YekanBakhFaNum-VF.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        font-family: 'Yekan Bakh', 'Vazirmatn', Tahoma, sans-serif;
        background-color: #fdfcfa;
        color: #1c1b18;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .wrap { max-width: 420px; }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #1656c9;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }
      h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.6rem; }
      p { color: #78766f; line-height: 1.8; margin-bottom: 1.75rem; }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: #1656c9;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        padding: 0.8rem 1.75rem;
        border-radius: 6px;
      }
      a.btn:hover { background-color: #0f3f9c; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <svg width="36" height="36" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="10" r="2.6" fill="#ffffff" />
          <circle cx="23" cy="22" r="2.6" fill="#bfe3ff" />
          <path d="M9 12.6v4a3.6 3.6 0 0 0 3.6 3.6h8.4a3.6 3.6 0 0 1 3.6 3.6" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" />
        </svg>
      </div>
      <h1>این صفحه پیدا نشد</h1>
      <p>ممکن است آدرس اشتباه باشد یا این صفحه جابه‌جا شده باشد. از اینجا می‌توانی به صفحه اصلی برگردی.</p>
      <a class="btn" href="/">بازگشت به بهبار</a>
    </div>
  </body>
</html>
