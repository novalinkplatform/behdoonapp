<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Light Purple to Rich Violet Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Frosted Glass Highlight -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#581c87" flood-opacity="0.35" />
    </filter>

    <filter id="symbolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Squircle with Purple Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#purpleGrad)" filter="url(#purpleGlow)" />

  <!-- Glass Sheen Layer -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#glassSheen)" />

  <!-- Frosted Glass Rim Border -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="4" />

  <!-- The Persian Letter "ب" (Behdoon Logo Mark) -->
  <g filter="url(#symbolGlow)">
    <!-- Body of "ب" -->
    <path
      d="M 376 175 C 376 265, 336 302, 256 302 C 176 302, 136 265, 136 175"
      fill="none"
      stroke="#ffffff"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Dot of "ب" (Tilted Diamond) -->
    <rect
      x="234"
      y="350"
      width="44"
      height="44"
      rx="10"
      fill="#ffffff"
      transform="rotate(45 256 372)"
    />
  </g>
</svg>
